name: PyPI

# Upload the wheels and sdists of a GitHub release to PyPI with trusted publishing (no token). Runs by manual dispatch
# for any existing release tag, and is dispatched by Release tag after the GitHub release exists (a dispatch with the
# workflow token is allowed; tag pushes with it are not). The PyPI trusted publishers name this file and one environment per project (pypi for heinzel-acme).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, such as v0.4.0
        required: true
        type: string

permissions: {}

concurrency:
  group: pypi-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch the release distributions of ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download the wheels and sdists of the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a release tag: $TAG" >&2; exit 1; }
          gh release download "$TAG" --dir dist --pattern '*.whl' --pattern '*.tar.gz'
          ls -1 dist
          test "$(ls dist | wc -l)" -eq 10  # five plugins, wheel and sdist each
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    # PyPI allows one pending trusted publisher per repository, workflow and environment, so each project has its own.
    name: Publish ${{ matrix.project }} ${{ inputs.tag }} to PyPI
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ matrix.env }}
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {project: heinzel-acme, file: heinzel_acme, env: pypi}
          - {project: heinzel-acme-payments, file: heinzel_acme_payments, env: pypi-heinzel-acme-payments}
          - {project: heinzel-acme-lisbon, file: heinzel_acme_lisbon, env: pypi-heinzel-acme-lisbon}
          - {project: heinzel-acme-payments-checkout, file: heinzel_acme_payments_checkout, env: pypi-heinzel-acme-payments-checkout}
          - {project: heinzel-acme-connectors, file: heinzel_acme_connectors, env: pypi-heinzel-acme-connectors}
    steps:
      # No checkout or build: this job is the only one with publishing authority.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-distributions
          path: all
      - name: Select this project's wheel and sdist
        env:
          FILE: ${{ matrix.file }}
        run: |
          mkdir dist
          cp "all/${FILE}"-*.whl "all/${FILE}"-*.tar.gz dist/
          test "$(ls dist | wc -l)" -eq 2
      - name: Publish with PyPI attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          attestations: true
          skip-existing: true
          verify-metadata: true
