name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *" # daily: new advisories and upstream changes break unchanged code too

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_FROZEN: "1"
  FORCE_COLOR: "1"

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Commit messages, pull request title and branch (conventional, no confidential terms)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.head_ref }}
          CONFIDENTIAL_TERMS: ${{ secrets.CONFIDENTIAL_TERMS }}
        run: make commits

  lint:
    name: Lint, contracts and types
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }} # pull requests reuse main's cache
      - name: Require the confidential terms
        # The repository is public: without the secret the confidentiality check would silently pass. Pull requests
        # from forks have no secrets.
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        env:
          CONFIDENTIAL_TERMS: ${{ secrets.CONFIDENTIAL_TERMS }}
        run: uv run --frozen --no-sync --no-build python scripts/check_confidentiality.py --require --text ""
      - run: make lint
        env:
          CONFIDENTIAL_TERMS: ${{ secrets.CONFIDENTIAL_TERMS }}
      - run: make typecheck

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit, not just the tip
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Scan the history for credentials (gitleaks pinned in scripts/tools.toml, checksum verified)
        run: make secrets

  setup:
    name: make setup (${{ matrix.os }})
    # What a contributor runs on a fresh machine, on each platform scripts/tools.toml pins: `make setup` installs
    # everything the build needs, relying only on git, make and uv, and `make doctor` confirms it.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }} # pull requests reuse main's cache
      - run: make setup
      - run: make doctor
      - name: Every pinned tool, for every platform, still downloads and matches its checksum
        if: matrix.os == 'ubuntu-latest'
        run: make tools-verify

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }} # pull requests reuse main's cache
      - run: make audit

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }} # a red cell is enough to know on a pull request
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }} # pull requests reuse main's cache
          python-version: ${{ matrix.python }}
      - name: Install what the tests need, and no more
        env:
          TEST_PYTHON: ${{ matrix.python }}
        run: |
          if [ "$TEST_PYTHON" = "3.15" ]; then
            uv sync --frozen --no-build --no-dev --group test --no-install-package pyyaml
            bash scripts/bootstrap-pyyaml.sh
          else
            uv sync --frozen --no-build --no-dev --group test
          fi
      - name: Unit and integration tests (unit first, 4 workers, stop at the first failure)
        env:
          UV_NO_SYNC: "1" # use the test group just installed
        run: make test-parallel

  coverage:
    name: Coverage
    # One measured run, in parallel with the matrix instead of after it.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # publishes the badge to the python-coverage-comment-action-data branch
      pull-requests: write # comments the coverage report on pull requests
    outputs:
      uncovered: ${{ steps.uncovered.outputs.files }} # the Coverage floor job names them in its verdict
    env:
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }} # pull requests reuse main's cache
          python-version: "3.14"
      - run: uv sync --frozen --no-build --no-dev --group test # UV_FROZEN: exactly the lockfile
      - run: make test
      - name: Record the total for the Coverage floor job
        if: ${{ !cancelled() }} # after make test's own threshold failed too, so the floor names the measured total
        run: uv run coverage report --format=total --precision=2 > coverage-total.txt
      - id: uncovered
        name: Name the least covered files for the Coverage floor verdict
        if: ${{ !cancelled() && hashFiles('coverage-total.txt') != '' }}
        run: |
          uv run coverage report --sort=-miss --skip-covered --skip-empty --show-missing --fail-under=0 > coverage-files.txt || true
          { echo 'files<<COVERAGE_EOF'; sed -n '3,14p' coverage-files.txt | grep -v '^-' | cut -c1-300 || true; echo 'COVERAGE_EOF'; } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && hashFiles('coverage-total.txt') != '' }} # a total below the threshold is still judged
        with:
          name: coverage-total
          path: coverage-total.txt
          retention-days: 7
      - name: Report coverage on pull requests and publish the badge
        # The action only understands pull_request, push and schedule events; dispatched runs (release PRs) skip it.
        if: github.event_name != 'workflow_dispatch'
        uses: py-cov-action/python-coverage-comment-action@07249dd712cd2464873eb8a59a24f97fd281e76f # v4.6
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 80

  e2e:
    name: End-to-end (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the install-from-git tests clone this repository
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }} # pull requests reuse main's cache
      - run: make test-e2e


  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: make build
      - name: Check each layer's wheel ships its package, and the team's its template contract
        run: |
          unzip -l dist/heinzel_acme-[0-9]*.whl | grep -q 'heinzel_acme/__init__.py'
          unzip -l dist/heinzel_acme_payments-[0-9]*.whl | grep -q 'heinzel_acme_payments/__init__.py'
          unzip -l dist/heinzel_acme_lisbon-[0-9]*.whl | grep -q 'heinzel_acme_lisbon/__init__.py'
          unzip -l dist/heinzel_acme_payments_checkout-[0-9]*.whl | grep -q 'templates/weekly-report.prose.md'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  # The coverage floor, judged inside this run (scripts/coverage_floor.py): the run tests the pull request's merge
  # commit, so there is no stale tested base and no separate check. Its verdict names measured vs required percent,
  # the scope and the least covered files; a broken judge says TOOL ERROR. CI OK requires it.
  coverage-floor:
    name: Coverage floor
    if: ${{ !cancelled() }}
    needs: [coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.judge.outputs.verdict }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the total this run's Coverage job measured
        if: needs.coverage.result == 'success' || needs.coverage.result == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-total
          path: ${{ runner.temp }}/coverage-total
      - id: judge
        name: Judge the coverage floor of this run's merge commit
        if: ${{ !cancelled() }} # also after a failed download: the judge names a missing total
        env:
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          COVERAGE_TOTAL: ${{ runner.temp }}/coverage-total/coverage-total.txt
          UNCOVERED: ${{ needs.coverage.outputs.uncovered }}
        run: python3 -I scripts/coverage_floor.py

  # Sonar's overall-code ratings (scripts/sonar_ratings.py): the SonarCloud check judges new code; this keeps
  # reliability, security and maintainability of the whole project at A. CI OK requires it on pull requests.
  sonar-ratings:
    name: Sonar ratings
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.judge.outputs.verdict }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: judge
        name: Overall reliability, security and maintainability are rated A
        run: python3 -I scripts/sonar_ratings.py

  # The gate guard (scripts/gate_guard.py, main's copy): a pull request that changes the coverage, floor, Sonar or
  # CI OK jobs, their scripts or pyproject's coverage and pytest sections needs the owner's label gate-change-approved.
  gate-guard:
    name: Gate guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the pull request's labels
      issues: read # who added the label, and when
      actions: read # when this run started
    outputs:
      verdict: ${{ steps.judge.outputs.verdict }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: judge
        name: Guarded gate inputs are unchanged, or the owner approved the change
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # the base is the test merge's first parent: main as it is merged into, not the PR's older base
          BASE_SHA="$(git rev-parse HEAD^1)"
          export BASE_SHA
          # main's copy judges, so a pull request can't loosen the guard that judges it; a first guard runs its own
          if git cat-file -e "$BASE_SHA:scripts/gate_guard.py" 2>/dev/null; then
            git show "$BASE_SHA:scripts/gate_guard.py" > "$RUNNER_TEMP/gate_guard.py"
          else
            cp scripts/gate_guard.py "$RUNNER_TEMP/gate_guard.py"
          fi
          python3 -I "$RUNNER_TEMP/gate_guard.py"

  ci-ok:
    name: CI OK
    if: always()
    needs: [dependency-review, commits, lint, secrets, setup, audit, test, coverage, coverage-floor, sonar-ratings, gate-guard, e2e, build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if any required job failed, naming each with its verdict
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          NEEDS: ${{ toJSON(needs) }}
          FLOOR: ${{ needs.coverage-floor.result }}
          SONAR: ${{ needs.sonar-ratings.result }}
          GUARD: ${{ needs.gate-guard.result }}
          EVENT: ${{ github.event_name }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped")
                  | "::error::Required job \(.key) ended with \(.value.result)\(if .value.outputs.verdict then ": " + .value.outputs.verdict else "" end)"' <<< "$NEEDS"
                exit 1 ;;
            esac
          done
          if [ "$FLOOR" != success ]; then echo "::error::Required job coverage-floor ended with ${FLOOR:-no result}"; exit 1; fi
          # Sonar ratings and the gate guard judge pull requests; a push, schedule or dispatch skips them
          for job in "sonar-ratings:$SONAR" "gate-guard:$GUARD"; do
            result="${job#*:}"
            if [ "$result" != success ] && { [ "$result" != skipped ] || [ "$EVENT" = pull_request ]; }; then
              echo "::error::Required job ${job%%:*} ended with ${result:-no result}"; exit 1
            fi
          done
