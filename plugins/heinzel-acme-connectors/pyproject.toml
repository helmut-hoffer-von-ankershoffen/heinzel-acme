[project]
name = "heinzel-acme-connectors"
version = "0.3.0"
description = "ACME's connectors for every capability, shaped for a company MCP gateway, on dummy data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["heinzel", "heinzel-plugin", "heinzelmaennchen"]
# A connector plugin, not a layer (ADR 0004): it depends on no layer, and on the core that has every capability it
# serves (tracker writes, attachments, the chat interface).
dependencies = ["heinzel>=0.9.41,<1"]

[project.urls]
Source = "https://github.com/helmut-hoffer-von-ankershoffen/heinzel-acme/tree/main/plugins/heinzel-acme-connectors"
Changelog = "https://github.com/helmut-hoffer-von-ankershoffen/heinzel-acme/blob/main/CHANGELOG.md"
Issues = "https://github.com/helmut-hoffer-von-ankershoffen/heinzel-acme/issues"

[project.scripts]
acme-chat = "heinzel_acme_connectors.acme_chat:main"

[project.entry-points."heinzel.modules"]
acme-connectors = "heinzel_acme_connectors"

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heinzel_acme_connectors"]

[tool.acme]
kind = "connector" # not a layer: the repository rules for layers skip it (ADR 0004)

[tool.heinzel.catalog]
title = "ACME Connectors"

[[tool.heinzel.catalog.screenshots]]
path = "docs/assets/screenshots/connector-choices.png"
surface = "ui"
caption = "Fictional ACME demo: each capability picked from ACME's own connectors in the app's connector settings."

[[tool.heinzel.catalog.screenshots]]
path = "docs/assets/screenshots/cli-connector-list.png"
surface = "cli"
caption = "Fictional ACME demo: the connector list with the dummy sign-in expired and ACME's connectors beside Google and Atlassian."
