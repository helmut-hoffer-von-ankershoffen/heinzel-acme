[project]
name = "heinzel-acme-payments-checkout"
version = "0.1.2"
description = "ACME Payments Checkout, a made-up team of the reference company: its weekly report playbook."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["heinzel", "heinzel-plugin", "heinzelmaennchen"]
# Its parent and site layers, so installing this plugin installs its stack (core ADR 0040); released together, the
# release process bumps the bounds.
dependencies = ["heinzel>=0.7.2,<1", "heinzel-acme>=0.1.2", "heinzel-acme-payments>=0.1.2", "heinzel-acme-lisbon>=0.1.2"]

[project.urls]
Source = "https://github.com/helmut-hoffer-von-ankershoffen/heinzel-acme/tree/main/plugins/heinzel-acme-payments-checkout"
Changelog = "https://github.com/helmut-hoffer-von-ankershoffen/heinzel-acme/blob/main/CHANGELOG.md"
Issues = "https://github.com/helmut-hoffer-von-ankershoffen/heinzel-acme/issues"

[project.entry-points."heinzel.modules"]
acme-payments-checkout = "heinzel_acme_payments_checkout"

[tool.uv.sources]
heinzel-acme = { workspace = true }
heinzel-acme-payments = { workspace = true }
heinzel-acme-lisbon = { workspace = true }

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heinzel_acme_payments_checkout"]

[tool.heinzel.catalog]
title = "ACME Payments Checkout"
[[tool.heinzel.catalog.screenshots]]
path = "docs/assets/screenshots/report-workflow.png"
surface = "ui"
caption = "Checkout's report connects code, tracker and documents; fictional local demonstration"

[[tool.heinzel.catalog.screenshots]]
path = "docs/assets/screenshots/report-inputs.png"
surface = "ui"
caption = "A real compiled weekly-report contract with its inputs and local draft; fictional ACME demonstration"

[[tool.heinzel.catalog.screenshots]]
path = "docs/assets/screenshots/draft-in-terminal.png"
surface = "ui"
caption = "Review an actual locally saved draft in the app terminal; fictional report from a deterministic demo runner"

[[tool.heinzel.catalog.screenshots]]
path = "docs/assets/screenshots/cli-draft.png"
surface = "cli"
caption = "The same locally saved fictional report, ready to review and edit; deterministic demo runner"
