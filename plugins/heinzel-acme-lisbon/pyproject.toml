[project]
name = "heinzel-acme-lisbon"
version = "0.1.2"
description = "ACME Lisbon, a made-up site of the reference company: time zone, working hours, meeting rhythm."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["heinzel", "heinzel-plugin", "heinzelmaennchen"]
# Its parent and site layers, so installing this plugin installs its stack (core ADR 0040); released together, the
# release process bumps the bounds.
dependencies = ["heinzel>=0.7.2,<1", "heinzel-acme>=0.1.2"]

[project.urls]
Source = "https://github.com/helmut-hoffer-von-ankershoffen/heinzel-acme/tree/main/plugins/heinzel-acme-lisbon"
Changelog = "https://github.com/helmut-hoffer-von-ankershoffen/heinzel-acme/blob/main/CHANGELOG.md"
Issues = "https://github.com/helmut-hoffer-von-ankershoffen/heinzel-acme/issues"

[project.entry-points."heinzel.modules"]
acme-lisbon = "heinzel_acme_lisbon"

[tool.uv.sources]
heinzel-acme = { workspace = true }

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heinzel_acme_lisbon"]

[tool.heinzel.catalog]
title = "ACME Lisbon"
[[tool.heinzel.catalog.screenshots]]
path = "docs/assets/screenshots/site-calendar.png"
surface = "ui"
caption = "Fictional ACME Lisbon demo: Friday stand-up, demo, and 17:00 report deadline in site and computer time."

[[tool.heinzel.catalog.screenshots]]
path = "docs/assets/screenshots/site-week-ahead.png"
surface = "ui"
caption = "Fictional ACME Lisbon demo: a four-day window crosses the weekend to Monday's stand-up, planning, and OKR review."

[[tool.heinzel.catalog.screenshots]]
path = "docs/assets/screenshots/site-report-deadline.png"
surface = "ui"
caption = "Fictional Checkout demo: the locally seeded weekly-report contract and its inputs give context to Lisbon's report rhythm."

[[tool.heinzel.catalog.screenshots]]
path = "docs/assets/screenshots/cli-calendar.png"
surface = "cli"
caption = "Fictional ACME Lisbon demo: working hours, weekly rhythm, and Friday's upcoming events in site and computer time."
