[project]
name = "heinzel-acme-payments"
version = "0.1.2"
description = "Acme Payments, a made-up org of the reference company: how it plans, by quarterly OKRs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["heinzel", "heinzel-plugin", "heinzelmaennchen"]
# Its parent and site layers, so installing this plugin installs its stack (core ADR 0040); released together, the
# release process bumps the bounds.
dependencies = ["heinzel>=0.7.2,<1", "heinzel-acme>=0.1.2"]

[project.urls]
Source = "https://github.com/helmut-hoffer-von-ankershoffen/heinzel-acme/tree/main/plugins/heinzel-acme-payments"
Changelog = "https://github.com/helmut-hoffer-von-ankershoffen/heinzel-acme/blob/main/CHANGELOG.md"
Issues = "https://github.com/helmut-hoffer-von-ankershoffen/heinzel-acme/issues"

[project.entry-points."heinzel.modules"]
acme-payments = "heinzel_acme_payments"

[tool.uv.sources]
heinzel-acme = { workspace = true }

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heinzel_acme_payments"]
